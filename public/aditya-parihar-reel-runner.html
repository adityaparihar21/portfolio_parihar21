<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aditya Parihar — Reel Runner</title>
<style>
  :root{
    --marquee-black: #0b0b0f;
    --shadow-navy: #050509;
    --marquee-gold: #e8b23d;
    --velvet-red: #b3122e;
    --reel-cream: #f4ead8;
    --projector-teal: #2a9d8f;
    --card-navy: #14141c;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0; height:100%;
    background: var(--shadow-navy);
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--reel-cream);
    overflow: hidden;
  }

  #app{
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #stage{
    position: relative;
    width: min(960px, 100vw);
    aspect-ratio: 16 / 8;
    background: var(--marquee-black);
    border: 3px solid #2a2a35;
    box-shadow: 0 0 0 6px var(--shadow-navy), 0 20px 60px rgba(0,0,0,0.6);
    overflow: hidden;
  }

  /* CRT scanline + vignette overlay */
  #scanlines{
    position:absolute; inset:0; z-index: 50; pointer-events:none;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0.15) 0px,
        rgba(0,0,0,0.15) 1px,
        transparent 2px,
        transparent 3px
      );
    mix-blend-mode: multiply;
  }
  #vignette{
    position:absolute; inset:0; z-index: 49; pointer-events:none;
    box-shadow: inset 0 0 120px rgba(0,0,0,0.65);
  }

  canvas#game{
    display:block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    background: linear-gradient(to bottom, #1a1a24 0%, #14141c 55%, #0b0b0f 100%);
  }

  /* ---------- HUD ---------- */
  #hud{
    position:absolute; top:0; left:0; right:0; z-index: 20;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding: 10px 16px;
    font-family: 'Courier New', monospace;
    font-weight: 700;
    letter-spacing: 1px;
    text-shadow: 0 0 4px rgba(232,178,61,0.6);
    pointer-events: none;
  }
  .sound-btn{
    pointer-events: auto;
    font-family:'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    background: transparent;
    border: 1px solid var(--marquee-gold);
    color: var(--marquee-gold);
    padding: 5px 8px;
    cursor: pointer;
    opacity: 0.85;
    align-self: flex-start;
  }
  .sound-btn:hover{ opacity: 1; }
  #hud .hud-block{ color: var(--marquee-gold); font-size: 14px; }
  #hud .hud-sub{ color: var(--reel-cream); font-size: 10px; opacity:0.75; letter-spacing: 2px;}
  #lives{ display:flex; gap:6px; margin-top:4px; }
  .life-dot{
    width:10px; height:10px; border-radius:50%;
    background: var(--velvet-red);
    box-shadow: 0 0 4px var(--velvet-red);
  }
  .life-dot.lost{ background: transparent; border: 1px solid #444; box-shadow:none; }

  /* ---------- Start screen ---------- */
  .screen{
    position:absolute; inset:0; z-index: 40;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap: 14px;
    background: radial-gradient(ellipse at center, rgba(20,20,28,0.96) 0%, rgba(5,5,9,0.98) 75%);
    padding: 20px;
  }
  .hidden{ display:none !important; }

  .marquee-title{
    font-size: clamp(28px, 5vw, 48px);
    font-style: italic;
    font-weight: 700;
    color: var(--marquee-gold);
    text-shadow: 0 0 12px rgba(232,178,61,0.5), 0 0 2px #000;
    letter-spacing: 1px;
  }
  .marquee-sub{
    font-family:'Courier New', monospace;
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--reel-cream);
    opacity: 0.85;
    text-transform: uppercase;
  }
  .blink{ animation: blink 1.4s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity: 0; } }

  .btn{
    font-family:'Courier New', monospace;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
    background: var(--velvet-red);
    color: var(--reel-cream);
    border: none;
    padding: 12px 26px;
    font-size: 13px;
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--shadow-navy);
    transition: transform 0.1s ease;
  }
  .btn:hover{ transform: translate(-1px,-1px); }
  .btn:active{ transform: translate(2px,2px); box-shadow: 0 0 0 var(--shadow-navy); }
  .btn.ghost{ background: transparent; border: 2px solid var(--marquee-gold); color: var(--marquee-gold); }

  /* ---------- Movie-ticket reveal cards ---------- */
  #reveal-overlay{
    position:absolute; inset:0; z-index:60;
    display:flex; align-items:center; justify-content:center;
    background: rgba(5,5,9,0.88);
    backdrop-filter: blur(1px);
  }

  .ticket-card{
    position:relative;
    display:flex;
    width: min(620px, 92%);
    max-height: 86%;
    background: var(--reel-cream);
    color: #241a1e;
    box-shadow: 0 18px 40px rgba(0,0,0,0.5);
    /* torn top/bottom edge via jagged clip */
    clip-path: polygon(
      0% 1.5%, 2% 0%, 4% 1.8%, 6% 0.2%, 8% 1.6%, 10% 0%, 12% 1.4%, 14% 0.3%,
      16% 1.7%, 18% 0%, 20% 1.5%, 22% 0.2%, 24% 1.8%, 26% 0%, 28% 1.3%, 30% 0.4%,
      32% 1.6%, 34% 0%, 36% 1.5%, 38% 0.2%, 40% 1.7%, 42% 0%, 44% 1.4%, 46% 0.3%,
      48% 1.6%, 50% 0%, 52% 1.5%, 54% 0.2%, 56% 1.8%, 58% 0%, 60% 1.3%, 62% 0.4%,
      64% 1.6%, 66% 0%, 68% 1.5%, 70% 0.2%, 72% 1.7%, 74% 0%, 76% 1.4%, 78% 0.3%,
      80% 1.6%, 82% 0%, 84% 1.5%, 86% 0.2%, 88% 1.8%, 90% 0%, 92% 1.3%, 94% 0.4%,
      96% 1.6%, 98% 0%, 100% 1.5%,
      100% 98.5%, 98% 100%, 96% 98.2%, 94% 99.8%, 92% 98.4%, 90% 100%, 88% 98.6%,
      86% 99.7%, 84% 98.3%, 82% 100%, 80% 98.5%, 78% 99.8%, 76% 98.2%, 74% 100%,
      72% 98.7%, 70% 99.6%, 68% 98.4%, 66% 100%, 64% 98.5%, 62% 99.6%, 60% 98.7%,
      58% 100%, 56% 98.2%, 54% 99.8%, 52% 98.5%, 50% 100%, 48% 98.4%, 46% 99.7%,
      44% 98.3%, 42% 100%, 40% 98.5%, 38% 99.8%, 36% 98.2%, 34% 100%, 32% 98.4%,
      30% 99.6%, 28% 98.7%, 26% 100%, 24% 98.5%, 22% 99.8%, 20% 98.2%, 18% 100%,
      16% 98.4%, 14% 99.7%, 12% 98.3%, 10% 100%, 8% 98.5%, 6% 99.8%, 4% 98.2%,
      2% 100%, 0% 98.5%
    );
    animation: stampSlam 0.4s cubic-bezier(.2,.9,.3,1.15);
  }
  @keyframes stampSlam{
    0%{ transform: scale(1.5) rotate(7deg); opacity:0; }
    55%{ transform: scale(0.96) rotate(-2deg); opacity:1; }
    100%{ transform: scale(1) rotate(-1.2deg); opacity:1; }
  }

  .ticket-main{
    flex: 1 1 auto;
    min-width: 0;
    padding: 30px 28px 24px;
    overflow-y: auto;
  }

  .ticket-perf{
    flex: 0 0 0;
    width: 0;
    border-left: 2px dashed rgba(36,26,30,0.35);
    position: relative;
  }
  .ticket-perf::before, .ticket-perf::after{
    content:"";
    position:absolute; left:-6px; width:12px; height:12px; border-radius:50%;
    background: var(--marquee-black);
  }
  .ticket-perf::before{ top:-6px; }
  .ticket-perf::after{ bottom:-6px; }

  .ticket-stub{
    flex: 0 0 116px;
    background: #e8dcc4;
    padding: 20px 10px;
    display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    position: relative;
  }
  .stub-vert{
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-family:'Courier New', monospace;
    font-weight:700;
    letter-spacing: 4px;
    font-size: 13px;
    color: var(--velvet-red);
    text-transform: uppercase;
  }
  .stub-meta{
    font-family:'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    color: #4a3a34;
    text-align:center;
    line-height: 1.8;
  }
  .barcode{
    width: 90%;
    height: 34px;
    background-image: repeating-linear-gradient(
      to right,
      #241a1e 0px, #241a1e 2px,
      transparent 2px, transparent 5px,
      #241a1e 5px, #241a1e 6px,
      transparent 6px, transparent 9px
    );
  }

  .stamp{
    position:absolute;
    top: 18px; right: 26px;
    border: 3px solid var(--velvet-red);
    color: var(--velvet-red);
    border-radius: 50%;
    width: 78px; height: 78px;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    font-family:'Courier New', monospace;
    font-weight:700;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    line-height: 1.15;
    transform: rotate(-14deg);
    opacity: 0.85;
    mix-blend-mode: multiply;
    pointer-events: none;
  }

  .reel-tag{
    font-family:'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--velvet-red);
    text-transform: uppercase;
    margin-bottom: 6px;
    font-weight: 700;
  }
  .ticket-main h2{
    font-style: italic;
    color: #241a1e;
    margin: 0 18px 14px 0;
    font-size: clamp(20px, 3vw, 27px);
  }
  .ticket-main p{
    font-size: 15px;
    line-height: 1.6;
    color: #322226;
    margin: 0 0 10px 0;
  }
  .ticket-main a{ color: #146a63; text-decoration: underline; font-weight:600; }

  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin: 10px 0 4px; }
  .chip{
    font-family:'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    border: 1px solid #146a63;
    color: #146a63;
    padding: 4px 10px;
    text-transform: uppercase;
  }

  .film-grid{
    display:grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 14px;
  }
  .film-poster{
    aspect-ratio: 2/3;
    background: repeating-linear-gradient(135deg, #ded0b2, #ded0b2 8px, #e8dcc4 8px, #e8dcc4 16px);
    border: 1px solid #c9b98f;
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding: 10px;
    font-family:'Courier New', monospace;
    font-size: 12px;
    letter-spacing:1px;
    color: #241a1e;
    font-weight: 700;
    position:relative;
  }
  .film-poster .rank{
    position:absolute; top:6px; left:6px;
    font-size:10px; color:var(--velvet-red); font-weight:700;
  }

  .card-actions{ margin-top: 18px; display:flex; gap:10px; justify-content:flex-end; }

  .intermission .ticket-stub{ background: #ecd0d0; }
  .intermission .stub-vert{ color: var(--marquee-black); }

  @media (max-width: 560px){
    .ticket-card{ flex-direction: column; max-height: 90%; }
    .ticket-perf{
      width: auto; height: 0;
      border-left: none;
      border-top: 2px dashed rgba(36,26,30,0.35);
    }
    .ticket-perf::before, .ticket-perf::after{ top:-6px; left:auto; }
    .ticket-perf::before{ left:-6px; }
    .ticket-perf::after{ right:-6px; left:auto; }
    .ticket-stub{
      flex-direction: row; justify-content:space-between; align-items:center;
      flex-basis: auto; width:100%; padding: 12px 20px;
    }
    .stub-vert{ writing-mode: horizontal-tb; font-size: 12px; }
    .barcode{ width: 40%; }
    .ticket-main{ padding: 22px 20px 18px; }
    .film-grid{ grid-template-columns: 1fr 1fr; }
    .stamp{ width:58px; height:58px; font-size:8px; top:10px; right:16px; }
  }
</style>
</head>
<body>

<div id="app">
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="scanlines"></div>
    <div id="vignette"></div>


    <div id="hud">
      <div class="hud-block">
        SCORE <span id="score-val">000</span>
        <div class="hud-sub">REEL <span id="reel-val">0</span> / 5</div>
      </div>
      <div class="hud-block" style="text-align:right;">
        LIVES
        <div id="lives"></div>
      </div>
      <button id="mute-btn" class="sound-btn" title="Toggle sound">SOUND: ON</button>
    </div>

    <!-- Start screen -->
    <div id="start-screen" class="screen">
      <div class="marquee-title">★ REEL RUNNER ★</div>
      <div class="marquee-sub">a personal introduction, in five reels</div>
      <div class="marquee-sub">starring Aditya Parihar</div>
      <button class="btn" id="start-btn">Press Start</button>
      <div class="marquee-sub blink" style="margin-top:6px;">space / tap to jump</div>
    </div>

    <!-- Reveal overlay -->
    <div id="reveal-overlay" class="screen hidden"></div>

    <!-- Game over (fail) -->
    <div id="fail-screen" class="screen hidden">
      <div class="marquee-title" style="color:var(--velvet-red);">CUT!</div>
      <div class="marquee-sub">the reel snapped early</div>
      <div class="marquee-sub" id="fail-score">score: 0</div>
      <button class="btn" id="retry-btn">Try Again</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* =========================================================
     CONFIG — edit the text/links below to keep this page current
     ========================================================= */
  const CONFIG = {
    name: "Aditya Parihar",
    letterboxd: "https://letterboxd.com/parihar21/",
    contactUrl: "", // TODO: put your contact page / email link here
    coinValue: 20,

    bio: {
      tag: "Reel 1 — Who I Am",
      title: "Third Year, Frame by Frame",
      lines: [
        "I'm Aditya Parihar — a Computer Science major in my third year at UPES, Dehradun, Uttarakhand.",
        "Code is my major, but cinema is where my head actually lives. I'm the kind of student who debugs a function and then goes home to rewatch a favorite scene just to study how it was cut."
      ],
      chips: ["CS Major", "3rd Year", "UPES · Dehradun", "Cinephile"]
    },

    hobbies: {
      tag: "Reel 2 — Off Screen",
      title: "When I'm Not Watching Something",
      lines: [
        "Football and running keep me moving. Chess keeps me thinking — I sit around 900–1000 Elo and I'm slowly climbing.",
        "But if you really want to know me, it's this: I watch films constantly — not just new releases, but old ones too. My Letterboxd is basically a diary."
      ],
      chips: ["Football", "Running", "Chess ~900–1000 Elo", "Film Diary"],
      link: { label: "See my Letterboxd →", url: "" } // filled at runtime from CONFIG.letterboxd
    },

    films: {
      tag: "Reel 3 — Top Cuts",
      title: "Four Films I Keep Coming Back To",
      intro: "These are the four sitting in my favorites right now — full posters and ratings live on my Letterboxd.",
      list: [
        "Beautiful Boy",
        "The Perks of Being a Wallflower",
        "Good Will Hunting",
        "Dil Bechara"
      ]
    },

    funfact: {
      tag: "Reel 4 — Outtake",
      title: "The Blooper Reel",
      lines: [
        "Fun fact: I sometimes stumble over certain sounds when I talk — words starting with things like \"wh-\" can trip me up.",
        "It's something I'm actively working on, and honestly, it's just part of my story — not something I hide."
      ],
      chips: ["Still a work in progress", "And that's okay"]
    },

    intermission: {
      tag: "Intermission",
      title: "One More Thing, Before the Credits",
      lines: [
        "Alongside all of this — the code, the football, the films — I'm seriously preparing for the CDS (Combined Defence Services) exam.",
        "A future in the defense services matters to me as much as filmmaking or engineering does. This isn't a side note — it's one of the main reels."
      ]
    },

    contact: {
      tag: "Reel 5 — The End",
      title: "Roll Credits",
      lines: [
        "Thanks for watching the whole reel. If any of this resonated — the films, the code, or the CDS prep — I'd genuinely like to hear from you."
      ]
    }
  };
  CONFIG.hobbies.link.url = CONFIG.letterboxd;

  /* =========================================================
     SOUND ENGINE — tiny 8-bit style synth, no audio files needed
     ========================================================= */
  const Sound = (function(){
    let ctx = null;
    let enabled = true;
    let musicTimer = null;
    let musicStep = 0;

    function ensureCtx(){
      if(!ctx){
        ctx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if(ctx.state === 'suspended') ctx.resume();
      return ctx;
    }

    function tone(freq, dur, type, vol, delay){
      if(!enabled) return;
      const ac = ensureCtx();
      const t0 = ac.currentTime + (delay||0);
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(vol||0.12, t0 + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain).connect(ac.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    }

    function jump(){ tone(440, 0.12, 'square', 0.10); tone(660, 0.10, 'square', 0.08, 0.03); }
    function coin(){ tone(988, 0.08, 'square', 0.10); tone(1318, 0.12, 'square', 0.10, 0.06); }
    function hit(){ tone(120, 0.22, 'sawtooth', 0.14); }
    function step(){ tone(200, 0.03, 'square', 0.03); }
    function reveal(){ tone(523,0.10,'triangle',0.09); tone(659,0.10,'triangle',0.09,0.09); tone(784,0.16,'triangle',0.10,0.18); }

    // tiny looping bassline while playing, very quiet, purely ambient
    const bassPattern = [98, 98, 131, 98, 110, 110, 147, 110];
    function startMusic(){
      stopMusic();
      musicStep = 0;
      musicTimer = setInterval(()=>{
        if(!enabled) return;
        const f = bassPattern[musicStep % bassPattern.length];
        tone(f, 0.18, 'triangle', 0.035);
        musicStep++;
      }, 260);
    }
    function stopMusic(){
      if(musicTimer){ clearInterval(musicTimer); musicTimer = null; }
    }
    function toggle(){
      enabled = !enabled;
      if(!enabled) stopMusic();
      return enabled;
    }
    function unlock(){ ensureCtx(); }

    return { jump, coin, hit, step, reveal, startMusic, stopMusic, toggle, unlock, isEnabled: ()=>enabled };
  })();

  document.getElementById('mute-btn').addEventListener('click', ()=>{
    const on = Sound.toggle();
    document.getElementById('mute-btn').textContent = 'SOUND: ' + (on ? 'ON' : 'OFF');
  });

  /* =========================================================
     CANVAS + GAME SETUP
     ========================================================= */
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');

  const LOGICAL_W = 960, LOGICAL_H = 480;
  let scale = 1;

  function resize(){
    const rect = stage.getBoundingClientRect();
    canvas.width = rect.width * devicePixelRatio;
    canvas.height = rect.height * devicePixelRatio;
    scale = canvas.width / LOGICAL_W;
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
  }
  window.addEventListener('resize', resize);

  const GROUND_Y = 360;
  const GRAVITY = 0.85;
  const JUMP_V = -15.5;

  let state = 'start'; // start | playing | reveal | fail
  let score = 0;
  let lives = 3;
  let speed = 6;
  let frame = 0;
  let coinsSpawned = 0;
  let shownMilestones = new Set();

  const player = {
    x: 110, y: GROUND_Y - 40, w: 34, h: 40, vy: 0, onGround: true, clap: 0, invuln: 0,
    holdingJump: false, squash: 1
  };

  let obstacles = []; // {x, y, w, h}
  let coins = [];     // {x, y, r, taken, wobble}
  let popups = [];    // floating "+20" text {x, y, life, text}

  const MILESTONES = [100, 200, 300, 400, 450, 500];

  /* ---------- Input ---------- */
  function jump(){
    if(state === 'start'){ startGame(); return; }
    if(state !== 'playing') return;
    if(player.onGround){
      player.vy = JUMP_V;
      player.onGround = false;
      player.holdingJump = true;
      player.squash = 1.3;
      Sound.jump();
    }
  }
  function releaseJump(){
    // variable jump height: letting go early cuts the jump short (Mario-style feel)
    if(player.holdingJump && player.vy < -6){
      player.vy = -6;
    }
    player.holdingJump = false;
  }
  window.addEventListener('keydown', (e)=>{
    if(e.code === 'Space' || e.code === 'ArrowUp'){
      e.preventDefault();
      jump();
    }
  });
  window.addEventListener('keyup', (e)=>{
    if(e.code === 'Space' || e.code === 'ArrowUp'){
      releaseJump();
    }
  });
  canvas.addEventListener('pointerdown', jump);
  canvas.addEventListener('pointerup', releaseJump);
  canvas.addEventListener('pointercancel', releaseJump);
  document.getElementById('start-btn').addEventListener('click', startGame);
  document.getElementById('retry-btn').addEventListener('click', startGame);

  /* ---------- Reset / Start ---------- */
  function startGame(){
    Sound.unlock();
    score = 0; lives = 3; speed = 6; frame = 0;
    coinsSpawned = 0; shownMilestones = new Set();
    obstacles = []; coins = []; popups = [];
    player.y = GROUND_Y - player.h; player.vy = 0; player.onGround = true; player.invuln = 0;
    player.holdingJump = false; player.squash = 1;
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('fail-screen').classList.add('hidden');
    document.getElementById('reveal-overlay').classList.add('hidden');
    updateHud();
    state = 'playing';
    Sound.startMusic();
  }

  /* ---------- Spawning ---------- */
  let spawnTimer = 0;
  function maybeSpawn(){
    spawnTimer--;
    if(spawnTimer <= 0){
      spawnTimer = 70 + Math.random()*50;
      const roll = Math.random();
      if(roll < 0.55){
        // coin
        coins.push({ x: LOGICAL_W + 20, y: GROUND_Y - 90 - Math.random()*40, r: 12, taken:false, wobble: Math.random()*10 });
      } else {
        // obstacle (film canister)
        obstacles.push({ x: LOGICAL_W + 20, y: GROUND_Y - 34, w: 28, h: 34 });
      }
    }
  }

  /* ---------- Update ---------- */
  function update(){
    frame++;
    speed = 6 + Math.min(4, score/150);

    // player physics
    const wasOnGround = player.onGround;
    player.vy += GRAVITY;
    player.y += player.vy;
    if(player.y >= GROUND_Y - player.h){
      player.y = GROUND_Y - player.h;
      if(!wasOnGround){ player.squash = 0.72; } // land squash
      player.vy = 0;
      player.onGround = true;
    }
    if(player.invuln > 0) player.invuln--;
    if(!player.onGround) player.clap = 0.4;
    else player.clap = (frame % 20 < 10) ? 0 : 0.5;

    // ease squash/stretch back to normal (juice)
    player.squash += (1 - player.squash) * 0.25;

    // footstep cadence while running on ground
    if(player.onGround && frame % 9 === 0){ Sound.step(); }

    maybeSpawn();

    // move + collide obstacles
    for(let i = obstacles.length - 1; i >= 0; i--){
      const o = obstacles[i];
      o.x -= speed;
      if(o.x + o.w < -20){ obstacles.splice(i,1); continue; }
      if(player.invuln === 0 &&
         player.x < o.x + o.w - 6 && player.x + player.w > o.x + 6 &&
         player.y + player.h > o.y + 6){
        hitObstacle();
      }
    }

    // move + collect coins
    for(let i = coins.length - 1; i >= 0; i--){
      const c = coins[i];
      c.x -= speed;
      if(c.x < -20){ coins.splice(i,1); continue; }
      if(!c.taken){
        const dx = (player.x + player.w/2) - c.x;
        const dy = (player.y + player.h/2) - c.y;
        if(Math.sqrt(dx*dx + dy*dy) < c.r + 18){
          c.taken = true;
          collectCoin(c.x, c.y);
        }
      }
    }
    coins = coins.filter(c => !c.taken);

    // update floating score popups
    for(let i = popups.length - 1; i >= 0; i--){
      const p = popups[i];
      p.y -= 0.8;
      p.life--;
      if(p.life <= 0) popups.splice(i,1);
    }

    checkMilestones();
  }

  function hitObstacle(){
    lives--;
    player.invuln = 90;
    player.squash = 1.25;
    Sound.hit();
    updateHud();
    if(lives <= 0){
      Sound.stopMusic();
      failGame();
    }
  }

  function collectCoin(cx, cy){
    score += CONFIG.coinValue;
    popups.push({ x: cx, y: cy, life: 40, text: '+' + CONFIG.coinValue });
    Sound.coin();
    updateHud();
  }

  function checkMilestones(){
    for(const m of MILESTONES){
      if(score >= m && !shownMilestones.has(m)){
        shownMilestones.add(m);
        openReveal(m);
        break; // one at a time
      }
    }
  }

  function updateHud(){
    document.getElementById('score-val').textContent = String(score).padStart(3,'0');
    const reelIdx = shownMilestones.size >= 6 ? 5 : Math.min(5, [...shownMilestones].filter(m=>m!==450).length);
    document.getElementById('reel-val').textContent = reelIdx;
    const livesEl = document.getElementById('lives');
    livesEl.innerHTML = '';
    for(let i=0;i<3;i++){
      const dot = document.createElement('div');
      dot.className = 'life-dot' + (i < lives ? '' : ' lost');
      livesEl.appendChild(dot);
    }
  }

  /* ---------- Draw ---------- */
  function draw(){
    ctx.clearRect(0,0,LOGICAL_W,LOGICAL_H);

    drawBackground();
    drawGround();

    obstacles.forEach(drawCanister);
    coins.forEach(drawCoin);
    drawPlayer();
    drawPopups();
  }

  // pre-computed star field so stars don't jitter every frame
  const STARS = Array.from({length: 40}, () => ({
    x: Math.random()*LOGICAL_W,
    y: Math.random()*(GROUND_Y*0.55),
    r: Math.random()*1.4 + 0.4,
    phase: Math.random()*Math.PI*2
  }));

  function drawBackground(){
    const skyTop = GROUND_Y - 260;

    // sky gradient — dusk over a screening room
    const sky = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    sky.addColorStop(0, '#1b1030');
    sky.addColorStop(0.55, '#2a1440');
    sky.addColorStop(1, '#3a1626');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, LOGICAL_W, GROUND_Y);

    // twinkling stars
    STARS.forEach(s=>{
      const tw = 0.5 + 0.5*Math.sin(frame*0.03 + s.phase);
      ctx.fillStyle = `rgba(244,234,216,${0.25 + tw*0.55})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fill();
    });

    // retro synthwave sun — a circle sliced by soft horizontal bands
    const sunX = LOGICAL_W*0.78, sunY = skyTop + 70, sunR = 62;
    ctx.save();
    ctx.beginPath();
    ctx.arc(sunX, sunY, sunR, 0, Math.PI*2);
    ctx.clip();
    const sunGrad = ctx.createLinearGradient(0, sunY-sunR, 0, sunY+sunR);
    sunGrad.addColorStop(0, '#f4c96b');
    sunGrad.addColorStop(0.55, '#e8b23d');
    sunGrad.addColorStop(1, '#b3122e');
    ctx.fillStyle = sunGrad;
    ctx.fillRect(sunX-sunR, sunY-sunR, sunR*2, sunR*2);
    ctx.fillStyle = '#1b1030';
    for(let i=0;i<5;i++){
      ctx.fillRect(sunX-sunR, sunY - sunR*0.15 + i*10, sunR*2, 4);
    }
    ctx.restore();

    // two soft parallax hill layers (smooth curves, not blocky rects)
    drawHillLayer(GROUND_Y - 46, 0.15, '#241033', 70);
    drawHillLayer(GROUND_Y - 20, 0.3, '#1a0c26', 46);
  }

  function drawHillLayer(baseY, speedMul, color, amp){
    const scrollX = (frame*speed*speedMul) % (LOGICAL_W);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(-scrollX, GROUND_Y+2);
    const step = 80;
    for(let x = -scrollX; x < LOGICAL_W + step; x += step){
      const y = baseY - Math.sin((x)*0.008)*amp*0.5 - amp*0.3;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(LOGICAL_W + step, GROUND_Y+2);
    ctx.closePath();
    ctx.fill();
  }

  function drawGround(){
    // filmstrip ground
    ctx.fillStyle = '#0b0b0f';
    ctx.fillRect(0, GROUND_Y, LOGICAL_W, LOGICAL_H-GROUND_Y);
    ctx.fillStyle = '#2a2a35';
    ctx.fillRect(0, GROUND_Y, LOGICAL_W, 6);
    // sprocket holes scrolling
    const holeSpacing = 34;
    const offset = (frame*speed) % holeSpacing;
    ctx.fillStyle = '#050509';
    for(let x = -holeSpacing; x < LOGICAL_W+holeSpacing; x += holeSpacing){
      const hx = x - offset;
      ctx.fillRect(hx, GROUND_Y+14, 12, 8);
    }
  }

  function drawPlayer(){
    const cx = player.x + player.w/2;
    const groundLine = GROUND_Y;
    const sx = 1 / Math.sqrt(player.squash);   // squash width
    const sy = player.squash;                   // squash height

    ctx.save();
    if(player.invuln > 0 && frame % 10 < 5){ ctx.globalAlpha = 0.4; }

    ctx.translate(cx, groundLine);
    ctx.scale(sx, sy);
    ctx.translate(-cx, -groundLine);

    const py = player.y;
    const px = player.x;

    // legs (alternate slightly for a running feel)
    const strideL = player.onGround ? Math.sin(frame*0.5)*3 : 0;
    ctx.fillStyle = '#e8b23d';
    ctx.fillRect(px+6, py+28+Math.max(0,strideL), 6, 12-Math.max(0,strideL));
    ctx.fillRect(px+player.w-12, py+28-Math.min(0,strideL), 6, 12+Math.min(0,strideL));

    // body
    ctx.fillStyle = '#b3122e';
    ctx.fillRect(px+4, py+14, player.w-8, 16);

    // clapperboard head (opens on jump)
    const clapOpen = player.onGround ? 0 : 6;
    ctx.fillStyle = '#14141c';
    ctx.fillRect(px+2, py, player.w-4, 10);
    ctx.fillStyle = '#f4ead8';
    ctx.fillRect(px+2, py - clapOpen, player.w-4, 4);

    // little red cap perched on top, just for character
    ctx.fillStyle = '#b3122e';
    ctx.beginPath();
    ctx.ellipse(px+player.w/2, py - clapOpen - 3, 9, 5, 0, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(px+player.w/2-9, py - clapOpen - 3, 18, 3);

    ctx.restore();
  }

  function drawCanister(o){
    ctx.fillStyle = '#2a2a35';
    ctx.beginPath();
    ctx.ellipse(o.x+o.w/2, o.y, o.w/2, 8, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#1c1c24';
    ctx.fillRect(o.x, o.y, o.w, o.h);
    ctx.fillStyle = '#b3122e';
    ctx.fillRect(o.x, o.y+o.h-6, o.w, 6);
  }

  function drawCoin(c){
    const bob = Math.sin(frame*0.08 + c.wobble) * 4;
    const flip = Math.cos(frame*0.15 + c.wobble); // simulates a spinning coin face-on
    ctx.save();
    ctx.translate(c.x, c.y + bob);
    ctx.scale(Math.max(0.15, Math.abs(flip)), 1);
    ctx.strokeStyle = '#e8b23d';
    ctx.fillStyle = 'rgba(232,178,61,0.12)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0,0,c.r,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();
    for(let a=0; a<6; a++){
      const ang = a * Math.PI/3;
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.lineTo(Math.cos(ang)*c.r, Math.sin(ang)*c.r);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawPopups(){
    ctx.save();
    ctx.font = "bold 14px 'Courier New', monospace";
    ctx.textAlign = 'center';
    popups.forEach(p=>{
      ctx.globalAlpha = Math.max(0, p.life/40);
      ctx.fillStyle = '#e8b23d';
      ctx.fillText(p.text, p.x, p.y);
    });
    ctx.restore();
  }

  /* ---------- Loop ---------- */
  function loop(){
    if(state === 'playing'){
      update();
      draw();
    }
    requestAnimationFrame(loop);
  }

  /* ---------- Fail ---------- */
  function failGame(){
    state = 'fail';
    document.getElementById('fail-score').textContent = 'score: ' + score;
    document.getElementById('fail-screen').classList.remove('hidden');
  }

  /* ---------- Reveal cards ---------- */
  function openReveal(milestoneScore){
    state = 'reveal';
    Sound.reveal();
    Sound.stopMusic();
    const overlay = document.getElementById('reveal-overlay');
    overlay.innerHTML = '';
    overlay.appendChild(buildCard(milestoneScore));
    overlay.classList.remove('hidden');
  }

  function closeReveal(){
    document.getElementById('reveal-overlay').classList.add('hidden');
    state = 'playing';
    Sound.startMusic();
  }

  function buildCard(m){
    const wrap = document.createElement('div');
    wrap.className = 'ticket-card' + (m === 450 ? ' intermission' : '');

    let data;
    if(m === 100) data = CONFIG.bio;
    else if(m === 200) data = CONFIG.hobbies;
    else if(m === 300) data = CONFIG.films;
    else if(m === 400) data = CONFIG.funfact;
    else if(m === 450) data = CONFIG.intermission;
    else if(m === 500) data = CONFIG.contact;

    const reelNumberMap = { 100:1, 200:2, 300:3, 400:4, 450:null, 500:5 };
    const reelNo = reelNumberMap[m];

    const main = document.createElement('div');
    main.className = 'ticket-main';

    const stamp = document.createElement('div');
    stamp.className = 'stamp';
    stamp.textContent = reelNo ? ('REEL ' + reelNo + ' \u2605 ADMIT') : 'INTERMISSION';
    main.appendChild(stamp);

    const tag = document.createElement('div');
    tag.className = 'reel-tag';
    tag.textContent = data.tag;
    main.appendChild(tag);

    const h2 = document.createElement('h2');
    h2.textContent = data.title;
    main.appendChild(h2);

    if(data.intro){
      const p = document.createElement('p');
      p.textContent = data.intro;
      main.appendChild(p);
    }

    if(data.lines){
      data.lines.forEach(line=>{
        const p = document.createElement('p');
        p.textContent = line;
        main.appendChild(p);
      });
    }

    if(data.chips){
      const row = document.createElement('div');
      row.className = 'chip-row';
      data.chips.forEach(c=>{
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.textContent = c;
        row.appendChild(chip);
      });
      main.appendChild(row);
    }

    if(data.link && data.link.url){
      const p = document.createElement('p');
      const a = document.createElement('a');
      a.href = data.link.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = data.link.label;
      p.appendChild(a);
      main.appendChild(p);
    }

    if(m === 300){
      const grid = document.createElement('div');
      grid.className = 'film-grid';
      data.list.forEach((title, i)=>{
        const poster = document.createElement('div');
        poster.className = 'film-poster';
        poster.innerHTML = '<span class="rank">0'+(i+1)+'</span>' + title;
        grid.appendChild(poster);
      });
      main.appendChild(grid);
      const p = document.createElement('p');
      const a = document.createElement('a');
      a.href = CONFIG.letterboxd; a.target='_blank'; a.rel='noopener';
      a.textContent = 'Full posters + ratings on Letterboxd →';
      p.appendChild(a);
      main.appendChild(p);
    }

    const actions = document.createElement('div');
    actions.className = 'card-actions';

    if(m === 500){
      const contactBtn = document.createElement('a');
      contactBtn.className = 'btn';
      contactBtn.textContent = 'Get In Touch';
      contactBtn.href = CONFIG.contactUrl || '#';
      if(!CONFIG.contactUrl){
        contactBtn.addEventListener('click', (e)=>{
          e.preventDefault();
          alert('Add your contact link in CONFIG.contactUrl in the code!');
        });
      }
      actions.appendChild(contactBtn);
      const restartBtn = document.createElement('button');
      restartBtn.className = 'btn ghost';
      restartBtn.textContent = 'Play Again';
      restartBtn.addEventListener('click', ()=>{ closeReveal(); startGame(); });
      actions.appendChild(restartBtn);
    } else {
      const btn = document.createElement('button');
      btn.className = 'btn';
      btn.textContent = 'Continue';
      btn.addEventListener('click', closeReveal);
      actions.appendChild(btn);
    }
    main.appendChild(actions);
    wrap.appendChild(main);

    // perforation divider
    const perf = document.createElement('div');
    perf.className = 'ticket-perf';
    wrap.appendChild(perf);

    // ticket stub
    const stub = document.createElement('div');
    stub.className = 'ticket-stub';

    const stubVert = document.createElement('div');
    stubVert.className = 'stub-vert';
    stubVert.textContent = 'Admit One';
    stub.appendChild(stubVert);

    const stubMeta = document.createElement('div');
    stubMeta.className = 'stub-meta';
    stubMeta.innerHTML = 'NO. ' + String(m).padStart(3,'0') + '<br>REEL ' + (reelNo || '—') + '/5';
    stub.appendChild(stubMeta);

    const barcode = document.createElement('div');
    barcode.className = 'barcode';
    stub.appendChild(barcode);

    wrap.appendChild(stub);

    return wrap;
  }

  /* ---------- Boot ---------- */
  resize();
  updateHud();
  requestAnimationFrame(loop);

})();
</script>
</body>
</html>
